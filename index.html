<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>"TTML" to TTML</title>
    
    <link rel="icon" type="image/svg+xml" href="icon.svg">

    <style>
        /* Import SF Pro Variable Font */
        @font-face {
            font-family: "SF Pro";
            src: url("https://raw.githubusercontent.com/sahibjotsaggu/San-Francisco-Pro-Fonts/master/SF-Pro.ttf") format("truetype");
            font-display: swap;
        }

        /* Import SF Mono Font */
        @font-face {
            font-family: "SF Mono";
            src: url("https://raw.githubusercontent.com/supercomputra/SF-Mono-Font/master/SFMono-Regular.otf") format("opentype");
            font-display: swap;
        }
        
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #fa243c; /* Apple Music Red */
            --text-color: #f5f5f7;
            --text-muted: #86868b;
            --border-color: #333333;
        }

        body {
            font-family: "SF Pro", -apple-system, BlinkMacSystemFont, sans-serif;
            font-variation-settings: "opsz" 18;
            font-weight: 400;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-family: "SF Pro", -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 28px;
            font-variation-settings: "opsz" 28;
            font-weight: 590; /* Semibold */
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Shift alignment context purely onto the text string container */
        h1 span {
            position: relative;
            padding-bottom: 12px;
        }


        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .tab-btn {
            font-family: inherit;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 6px;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: white;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            color: var(--text-color);
            cursor: pointer;
            font-family: "SF Pro", -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 400;
        }

        /* Target code element strictly inside the checkbox label wrapper */
        .checkbox-group code {
            font-family: "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 13px;
            background-color: #2c2c2e;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .checkbox-group input {
            accent-color: var(--accent-color);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input[type="text"] {
            font-family: inherit;
            width: 100%;
            background-color: #2c2c2e;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            padding: 10px;
            font-size: 14px;
            box-sizing: border-box;
        }

        textarea {
            font-family: "SF Mono", SFMono-Regular, Consolas, monospace !important;
            width: 100%;
            background-color: #2c2c2e;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            padding: 10px;
            font-size: 14px;
            box-sizing: border-box;
            resize: vertical;
            height: 150px;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        pre {
            font-family: "SF Mono", SFMono-Regular, Consolas, monospace !important;
            background-color: #000000;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            overflow-x: auto;
            font-size: 13px;
            line-height: 1.5;
            max-height: 350px;
            white-space: pre-wrap;
        }

        button.action-btn {
            font-family: inherit;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button.action-btn:hover {
            opacity: 0.9;
        }

        .copy-btn {
            font-family: inherit;
            background-color: #2c2c2e;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
        }

        .split-controls {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed var(--border-color);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .split-btn {
            font-family: inherit;
            background-color: #2c2c2e;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .split-btn:hover {
            background-color: rgba(250, 36, 60, 0.1);
        }

        .error {
            color: #ff453a;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .preview-container {
            margin-top: 20px;
            padding: 15px;
            background: #151515;
            border-radius: 8px;
            border-left: 4px solid var(--accent-color);
        }

        .song-meta {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 10px;
            border-bottom: 1px solid #222;
            padding-bottom: 8px;
        }

        .lyrics-line {
            margin: 6px 0;
            font-size: 15px;
            white-space: pre-wrap;
        }

        .bg-vocal-text {
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>
        <img src="icon.svg" alt="Lyrics Icon" width="34" height="34" style="display: inline-block; vertical-align: middle;">
        <span>"TTML" to TTML</span>
    </h1>

    <div class="card">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('json')">Paste JSON Output</button>
            <button class="tab-btn" onclick="switchTab('api')">Fetch via Lyrics API</button>
        </div>

        <label class="checkbox-group">
            <input type="checkbox" id="keep-parentheses" checked>
            Keep (<code>parentheses</code>)
        </label>

        <div id="json-section">
            <div class="form-group">
                <label for="json-input">Paste raw JSON payload here</label>
                <textarea id="json-input" placeholder='{\n  "ttml": "<?xml version=\"1.0\"...",\n  "processingTime": ...\n}'></textarea>
            </div>
            <button class="action-btn" onclick="processJSON()">Extract TTML Document</button>
        </div>

        <div id="api-section" style="display: none;">
            <div class="form-group">
                <label>Fetch Parameters</label>
                <div class="input-row">
                    <input type="text" id="api-artist" placeholder="Artist (e.g., Madonna)">
                    <input type="text" id="api-title" placeholder="Song Title (e.g., Bring Your Love)">
                </div>
            </div>
            <button class="action-btn" onclick="fetchFromAPI()">Fetch and Extract</button>
        </div>

        <div id="error-message" class="error"></div>
    </div>

    <div id="output-section" class="card" style="display: none;">
        <div class="output-header">
            <label>Valid Apple Audio TTML Output Document</label>
            <button class="copy-btn" id="main-copy" onclick="copyToClipboard(document.getElementById('ttml-output').innerText, this)">Copy Whole Document</button>
        </div>
        <div class="code-container">
            <pre id="ttml-output"></pre>
        </div>

        <div class="split-controls">
            <button class="split-btn" onclick="splitTtml()">Split into 2 Parts (Android Safe)</button>
            <button class="copy-btn" id="copy-part1" style="display:none;" onclick="copyPart(1, this)">Copy Part 1</button>
            <button class="copy-btn" id="copy-part2" style="display:none;" onclick="copyPart(2, this)">Copy Part 2</button>
        </div>

        <div id="lyrics-preview" class="preview-container">
            <div class="song-meta" id="meta-output"></div>
            <div id="lines-output"></div>
        </div>
    </div>
</div>

<script>
    class MusicCatalogAPI {
        async getCatalogInfo(query, storefront = "us", mode = "song", offset = 0) {
            const rawTitle = (query.title || '').trim();
            const rawArtist = (query.artistName || '').trim();

            if (!rawTitle && !rawArtist) return null;

            let result = await this._executeSearch(`${rawTitle} ${rawArtist}`, storefront, mode, offset);

            if (!result && rawTitle.includes("(")) {
                const strippedTitle = rawTitle.replace(/\([^\)]*\)/g, "").trim();
                result = await this._executeSearch(`${strippedTitle} ${rawArtist}`, storefront, mode, offset);
            }

            if (!result && rawTitle) {
                result = await this._executeSearch(rawTitle, storefront, mode, offset);
            }

            return result;
        }

        async _executeSearch(searchTerm, storefront, mode, offset) {
            if (!searchTerm.trim()) return null;

            const entity = mode === "album" ? "album" : "song";

            const params = new URLSearchParams({
                term: searchTerm.trim(),
                country: storefront || 'us',
                media: 'music',
                entity: entity,
                limit: '25'
            });

            const targetUrl = `https://itunes.apple.com/search?${params.toString()}`;

            try {
                const response = await fetch(targetUrl);
                if (!response.ok) return null;

                const data = await response.json();
                const results = data.results || [];

                if (results.length === 0 || offset >= results.length) return null;

                const item = results[offset];

                const rawCover = item.artworkUrl100 || "";
                const artworkUrl = rawCover ? rawCover.replace("100x100bb", "1000x1000bb") : "";

                const title = item.trackName || item.collectionName || "Unknown Title";
                const id = String(item.trackId || item.collectionId || "");
                const isExplicit = (item.trackExplicitness === "explicit" || item.collectionExplicitness === "explicit");

                return {
                    title: title,
                    artistName: item.artistName,
                    collectionName: item.collectionName,
                    albumCoverLink: artworkUrl,
                    appleID: id,
                    isExplicit: isExplicit,
                    motionM3u8: item.motionM3u8 || null,
                    motionMp4: item.motionMp4 || null
                };
            } catch (e) {
                console.error("iTunes Search API Error:", e);
                return null;
            }
        }
    }

    class TTMLService {
        static async fetchTTML(songId) {
            try {
                const url = `https://lyrics.paxsenix.org/apple-music/lyrics?id=${songId}&ttml=true`;
                const response = await fetch(url);
                if (!response.ok) return null;

                const data = await response.json();
                if (data.type === 'TTML' && data.content) {
                    return data.content; 
                }
                return null;
            } catch (e) {
                console.error("Error fetching TTML from Paxsenix:", e);
                return null;
            }
        }

        static parseTTMLToStructuredLyrics(xmlString) {
            if (!xmlString) return { timingType: 'None', lines: [] };

            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlString, "text/xml");
            
            const ttElement = xmlDoc.querySelector('tt');
            const timingType = ttElement ? (ttElement.getAttribute('itunes:timing') || 'None') : 'None';

            const paragraphs = xmlDoc.querySelectorAll('p');
            const structuredLines = [];

            paragraphs.forEach((p, lineIdx) => {
                const songPart = p.closest('div')?.getAttribute('itunes:songPart') || 'Verse';
                const isBackground = p.getAttribute('ttm:role') === 'x-bg';

                let fullText = "";

                if (timingType === 'Word') {
                    const spans = Array.from(p.querySelectorAll('span'));
                    const directSpans = spans.filter(span => !span.querySelector('span'));
                    fullText = directSpans.map(s => s.textContent).join('').trim();
                } else {
                    fullText = p.textContent.trim();
                }

                if (fullText) {
                    structuredLines.push({
                        lineId: `L${lineIdx + 1}`,
                        section: songPart,
                        isBackground: isBackground,
                        fullText: fullText
                    });
                }
            });

            return {
                timingType: timingType,
                lines: structuredLines
            };
        }
    }

    const catalogService = new MusicCatalogAPI();
    let debounceTimer = null;
    let currentCatalogId = "";
    let currentMode = "song"; 
    let currentTrackTitle = "";
    let currentArtistName = "";

    let currentRawTTML = "";
    let ttmlPart1 = "";
    let ttmlPart2 = "";

    function toggleSearchMode() {
        currentMode = (currentMode === "song") ? "album" : "song";

        const songInput = document.getElementById('song-input');
        const searchIcon = document.getElementById('song-input-icon');

        if (currentMode === "album") {
            songInput.placeholder = "Album";
            if (searchIcon) searchIcon.src = "ics/album.svg";
        } else {
            songInput.placeholder = "Song";
            if (searchIcon) searchIcon.src = "ics/note.svg";
        }

        if (searchIcon) {
            searchIcon.classList.remove('copy-animated');
            void searchIcon.offsetWidth;
            searchIcon.classList.add('copy-animated');
        }

        handleSearch();
    }

    function handleSearch() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(performSearch, 400);
    }

    function showError(msg) {
        const errorBox = document.getElementById('error-box');
        if (msg) {
            errorBox.innerText = msg;
            errorBox.style.display = 'block';
            document.getElementById('result-card').style.display = 'none';
            const lyricsContainer = document.getElementById('lyrics-container');
            const lyricsActions = document.getElementById('lyrics-actions');
            if (lyricsContainer) lyricsContainer.style.display = 'none';
            if (lyricsActions) lyricsActions.style.display = 'none';
        } else {
            errorBox.style.display = 'none';
        }
    }

    async function resolveBestM3u8Variant(masterUrl) {
        try {
            const corsProxy = "https://corsproxy.io/?";
            const response = await fetch(corsProxy + encodeURIComponent(masterUrl));
            if (!response.ok) return masterUrl;

            const text = await response.text();
            const lines = text.split('\n');
            
            let maxBandwidth = 0;
            let bestVariantUrl = null;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();

                if (line.startsWith('#EXT-X-STREAM-INF:') && !line.includes('trickplay')) {
                    const bandwidthMatch = line.match(/BANDWIDTH=(\d+)/);
                    const bandwidth = bandwidthMatch ? parseInt(bandwidthMatch[1], 10) : 0;
                    const nextLine = lines[i + 1] ? lines[i + 1].trim() : '';

                    if (bandwidth > maxBandwidth && nextLine) {
                        maxBandwidth = bandwidth;
                        bestVariantUrl = nextLine;
                    }
                }
            }

            if (bestVariantUrl) {
                return new URL(bestVariantUrl, masterUrl).href;
            }
        } catch (e) {
            console.warn("Failed to parse master m3u8 playlist, falling back to original source:", e);
        }
        return masterUrl;
    }

    async function loadArtworkPipeline(staticImgUrl, m3u8Url = null, mp4Url = null) {
        const artworkImg = document.getElementById('artwork-img');
        const videoEl = document.getElementById('artwork-video');

        artworkImg.src = staticImgUrl || "";

        if (!videoEl) return;

        videoEl.pause();
        videoEl.style.display = 'none';

        if (!m3u8Url && !mp4Url) {
            videoEl.removeAttribute('src');
            return;
        }

        const tryVideoSource = (src) => {
            return new Promise((resolve) => {
                videoEl.src = src;
                videoEl.oncanplay = () => resolve(true);
                videoEl.onerror = () => resolve(false);
                videoEl.load();
            });
        };

        const supportsNativeHLS = videoEl.canPlayType('application/vnd.apple.mpegurl') !== '';
        let isVideoReady = false;

        if (m3u8Url) {
            m3u8Url = await resolveBestM3u8Variant(m3u8Url);
        }

        if (m3u8Url && supportsNativeHLS) {
            isVideoReady = await tryVideoSource(m3u8Url);
        }

        if (!isVideoReady && mp4Url) {
            isVideoReady = await tryVideoSource(mp4Url);
        }

        if (isVideoReady) {
            videoEl.style.display = 'block';
            videoEl.play().catch(() => {
                videoEl.style.display = 'none';
            });
        }
    }

    function renderLyricsUI(structuredData) {
        const lyricsContainer = document.getElementById('lyrics-container');
        const syncBadge = document.getElementById('sync-badge');
        const lyricsBody = document.getElementById('lyrics-body');

        if (!lyricsContainer || !lyricsBody) return;

        if (!structuredData || !structuredData.lines || structuredData.lines.length === 0) {
            lyricsContainer.style.display = 'none';
            return;
        }

        if (syncBadge) {
            syncBadge.innerText = `${structuredData.timingType} Synced`;
        }

        let currentSection = null;
        let htmlContent = '';

        structuredData.lines.forEach((line) => {
            if (line.section && line.section !== currentSection) {
                currentSection = line.section;
                htmlContent += `<div class="section-label">${currentSection}</div>`;
            }

            const bgClass = line.isBackground ? 'is-bg' : '';
            htmlContent += `<div class="lyric-line ${bgClass}">${line.fullText}</div>`;
        });

        lyricsBody.innerHTML = htmlContent;
        lyricsContainer.style.display = 'block';
    }

    function copyFullTTML() {
        if (!currentRawTTML) return;
        navigator.clipboard.writeText(currentRawTTML).then(() => {
            alert("Full TTML copied to clipboard!");
        });
    }

    // DOM-based Split Function (Prevents redundant xmlns attributes on child nodes)
    function splitTTML() {
        if (!currentRawTTML) return;

        const parser = new DOMParser();
        const serializer = new XMLSerializer();

        // Create 2 distinct DOM document trees
        const doc1 = parser.parseFromString(currentRawTTML, "text/xml");
        const doc2 = parser.parseFromString(currentRawTTML, "text/xml");

        const p1 = Array.from(doc1.querySelectorAll("p"));
        const p2 = Array.from(doc2.querySelectorAll("p"));

        if (p1.length === 0) return;

        const halfIndex = Math.ceil(p1.length / 2);

        // Remove the second half of paragraphs from Document 1
        p1.slice(halfIndex).forEach(p => p.remove());

        // Remove the first half of paragraphs from Document 2
        p2.slice(0, halfIndex).forEach(p => p.remove());

        // Remove empty div containers left behind in either document
        [doc1, doc2].forEach(doc => {
            doc.querySelectorAll("body div").forEach(div => {
                if (div.querySelectorAll("p").length === 0) {
                    div.remove();
                }
            });
        });

        const xmlHeader = '<?xml version="1.0" encoding="UTF-8"?>\n';

        ttmlPart1 = xmlHeader + serializer.serializeToString(doc1);
        ttmlPart2 = xmlHeader + serializer.serializeToString(doc2);

        const splitBtn = document.getElementById('split-btn');
        const splitContainer = document.getElementById('split-parts-container');

        if (splitBtn) splitBtn.style.display = 'none';
        if (splitContainer) splitContainer.style.display = 'inline-flex';
    }

    function copyTTMLPart(partNumber) {
        const textToCopy = partNumber === 1 ? ttmlPart1 : ttmlPart2;
        if (!textToCopy) return;

        navigator.clipboard.writeText(textToCopy).then(() => {
            alert(`TTML Part ${partNumber} copied!`);
        });
    }

    function downloadTTML() {
        if (!currentRawTTML) return;

        const rawFileName = (currentArtistName && currentTrackTitle)
            ? `${currentArtistName} - ${currentTrackTitle}`
            : `lyrics_${currentCatalogId}`;
            
        const safeFileName = rawFileName.replace(/[/\\?%*:|"<>]/g, '') + '.ttml';

        const blob = new Blob([currentRawTTML], { type: "application/xml" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = safeFileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    async function performSearch() {
        showError(null);

        const title = document.getElementById('song-input').value.trim();
        const artistName = document.getElementById('artist-input').value.trim();
        const storefront = document.getElementById('storefront-select').value;

        if (!title && !artistName) {
            document.getElementById('result-card').style.display = 'none';
            const lyricsContainer = document.getElementById('lyrics-container');
            const lyricsActions = document.getElementById('lyrics-actions');
            if (lyricsContainer) lyricsContainer.style.display = 'none';
            if (lyricsActions) lyricsActions.style.display = 'none';
            return;
        }

        const info = await catalogService.getCatalogInfo({ title, artistName }, storefront, currentMode);

        if (!info) {
            return showError("No catalog matches found.");
        }

        currentCatalogId = info.appleID;
        currentTrackTitle = info.title;
        currentArtistName = info.artistName;

        const titleContainer = document.getElementById('res-song-title');
        titleContainer.innerText = info.title;
        
        let explicitIcon = document.getElementById('explicit-badge');
        if (info.isExplicit) {
            if (!explicitIcon) {
                explicitIcon = document.createElement('img');
                explicitIcon.id = 'explicit-badge';
                explicitIcon.src = 'ics/e.svg';
                explicitIcon.style.cssText = 'width: 16px; height: 16px; margin-left: 6px; vertical-align: middle;';
            }
            titleContainer.appendChild(explicitIcon);
        } else if (explicitIcon) {
            explicitIcon.remove();
        }

        if (info.collectionName && info.collectionName !== info.title) {
            document.getElementById('res-artist-name').innerText = `${info.artistName} • ${info.collectionName}`;
        } else {
            document.getElementById('res-artist-name').innerText = info.artistName;
        }

        document.getElementById('res-id-text').innerText = `ID: ${info.appleID}`;
        
        loadArtworkPipeline(info.albumCoverLink, info.motionM3u8, info.motionMp4);

        document.getElementById('result-card').style.display = 'flex';

        // Fetch & parse Paxsenix Apple TTML Lyrics
        const lyricsActions = document.getElementById('lyrics-actions');
        const splitBtn = document.getElementById('split-btn');
        const splitParts = document.getElementById('split-parts-container');

        if (currentMode === "song" && currentCatalogId) {
            currentRawTTML = await TTMLService.fetchTTML(currentCatalogId);
            
            if (currentRawTTML) {
                const structuredLyrics = TTMLService.parseTTMLToStructuredLyrics(currentRawTTML);
                renderLyricsUI(structuredLyrics);

                if (splitParts) splitParts.style.display = 'none';
                if (splitBtn) splitBtn.style.display = 'inline-flex';
                if (lyricsActions) lyricsActions.style.display = 'flex';
            } else {
                currentRawTTML = "";
                renderLyricsUI(null);
                if (lyricsActions) lyricsActions.style.display = 'none';
            }
        } else {
            currentRawTTML = "";
            renderLyricsUI(null);
            if (lyricsActions) lyricsActions.style.display = 'none';
        }
    }

    function copySongId(pillElement) {
        if (!currentCatalogId) return;

        navigator.clipboard.writeText(currentCatalogId).then(() => {
            const iconImg = document.getElementById('copy-icon');
            if (iconImg) {
                iconImg.src = "ics/dodf.svg";
                setTimeout(() => {
                    iconImg.src = "ics/dod.svg";
                }, 1800);
            }
        });
    }
</script>
</body>
</html>
